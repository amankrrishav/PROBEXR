[project]
name = "probexr-backend"
version = "1.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "--cov=app --cov-fail-under=75 -q"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Starlette 0.52+ makes Request generic over scope type, but FastAPI's
# parameter analysis breaks when Request[T] is used in endpoint signatures.
# Disable type-arg to avoid noise from framework types.
disable_error_code = ["type-arg"]

# ── Per-module overrides for third-party libs without stubs ──
[[tool.mypy.overrides]]
module = [
    "sqlmodel.*",
    "sqlalchemy.*",
    "httpx.*",
    "pydantic_settings.*",
    "redis.*",
    "aiosqlite.*",
    "asyncpg.*",
    "bs4.*",
    "prometheus_client.*",
    "argon2.*",
    "jwt.*",
    "uvicorn.*",
    "gunicorn.*",
    "alembic.*",
    "python_json_logger.*",
    "pythonjsonlogger.*",
    "starlette.*",
    "fastapi.*",
    "sentry_sdk.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",   # assert usage (ok in tests)
    "S105",   # hardcoded passwords (false positives on test fixtures)
    "S106",   # hardcoded passwords
    "B008",   # function call in default arg (FastAPI Depends pattern)
    "E402",   # module-level import not at top (FastAPI pattern: logger between imports)
    "E741",   # ambiguous variable name 'l' (used in list comprehensions)
    "S110",   # try-except-pass (intentional in best-effort fallbacks)
    "E701",   # multiple statements on one line (compact dict comprehensions)
    "S104",   # possible binding to all interfaces (intentional for dev server)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"app/models/__init__.py" = ["F401"]  # re-exports for SQLAlchemy model registration

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
