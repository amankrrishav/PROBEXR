name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────── Backend ────────────────────────────
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    env:
      # Minimal env vars so the app boots + tests run against SQLite
      DATABASE_URL: "sqlite+aiosqlite://"
      SECRET_KEY: "ci-test-secret-key"
      ENVIRONMENT: "testing"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint — ruff check + format
        run: |
          pip install ruff
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Lint — mypy type check
        run: mypy app/

      - name: Security — bandit static analysis
        run: |
          pip install bandit
          bandit -r app/ -x tests/

      - name: Security — pip-audit vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Test — pytest + coverage
        run: pytest tests/ -q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80

  # ──────────────────────────── Frontend ────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security — npm audit vulnerability scan
        run: npm audit --audit-level=high

      - name: Lint — ESLint
        run: npm run lint

      - name: Test — Vitest
        run: npm test
